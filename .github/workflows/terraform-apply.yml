# Triggered when a PR is merged into main (push to main).
# Runs: init → plan → apply (auto-approved)
# Make sure branch protection requires the Plan workflow to pass before merge.

name: Terraform Apply

on:
  push:
    branches:
      - main
    paths:
      - "**.tf"
      - "**.tfvars"
      - ".github/workflows/terraform-apply.yml"

permissions:
  contents: read

env:
  TF_VERSION: "1.7.5"
  AWS_REGION: "us-east-1"

jobs:
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    environment: production   # optional: set up a GitHub Environment with protection rules

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── AWS Credentials ─────────────────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      # ── Terraform Setup ──────────────────────────────────────────────────────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # ── Init ─────────────────────────────────────────────────────────────────
      - name: Terraform Init
        run: terraform init

      # ── Plan (re-run to confirm state hasn't drifted) ────────────────────────
      - name: Terraform Plan
        run: terraform plan -no-color -out=tfplan
        env:
          TF_VAR_vpc_id:    ${{ secrets.TF_VAR_VPC_ID }}
          TF_VAR_subnet_id: ${{ secrets.TF_VAR_SUBNET_ID }}

      # ── Apply ─────────────────────────────────────────────────────────────────
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
